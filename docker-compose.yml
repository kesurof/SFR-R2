services:
  sfr-r2:
    image: ghcr.io/kesurof/sfr-r2-public:latest
    # Pour construire l'image localement au lieu de la tirer du registre :
    #   décommenter la ligne ci-dessous puis `docker compose up -d --build`
    # build: .
    pull_policy: always
    expose:
      # Port interne uniquement, sans réservation d'un port sur l'hôte.
      - "3000"
    env_file: .env
    volumes:
      - sfr_data:/data
    restart: unless-stopped

volumes:
  sfr_data:
